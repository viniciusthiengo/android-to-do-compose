plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'dagger.hilt.android.plugin'
}

android {
    namespace 'com.example.to_docompose'
    compileSdk 37

    defaultConfig {
        applicationId "com.example.to_docompose"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'

    implementation "androidx.compose.ui:ui:1.11.4"
    implementation "androidx.compose.ui:ui-tooling-preview:1.11.4"
    implementation "androidx.compose.material:material:1.11.4"
    implementation "androidx.compose.material:material-icons-extended:1.7.8"
    implementation "com.google.accompanist:accompanist-systemuicontroller:0.36.0"

    implementation 'androidx.core:core-splashscreen:1.2.0'

    // Compose Navigation.
    implementation "androidx.navigation:navigation-compose:2.9.8"

    // Room.
    def room_version = "2.8.4"
    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    // DataStore Preferences.
    implementation 'androidx.datastore:datastore-preferences:1.2.1'

    // Dagger - Hilt
    implementation "com.google.dagger:hilt-android:$hilt_version"
    ksp "com.google.dagger:hilt-compiler:$hilt_version"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.11.4"
    debugImplementation "androidx.compose.ui:ui-tooling:1.11.4"
    debugImplementation "androidx.compose.ui:ui-test-manifest:1.11.4"
}

configurations.implementation {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
